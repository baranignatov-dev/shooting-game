<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man Shooting Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: Arial, sans-serif;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            z-index: 10;
        }
        
        #score {
            margin-bottom: 10px;
            color: #FF0000;
            font-weight: bold;
        }
        
        #health {
            color: #FF6B00;
            font-weight: bold;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            z-index: 100;
            display: none;
            border: 3px solid #FF0000;
        }
        
        #gameOver h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #FF0000;
        }
        
        #gameOver p {
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        #gameOver button {
            padding: 15px 30px;
            font-size: 20px;
            background: #FF0000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="score">Score: 0</div>
        <div id="health">Health: 100</div>
    </div>
    
    <div id="gameOver">
        <h1>GAME OVER!</h1>
        <p id="finalScore">Final Score: 0</p>
        <button onclick="location.reload()">Play Again</button>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Player (Spider-Man)
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            width: 50,
            height: 50,
            speed: 5,
            health: 100,
            angle: 0
        };
        
        let score = 0;
        let gameRunning = true;
        
        // Bullets (Web shots)
        let bullets = [];
        
        // Enemies (Villains)
        let enemies = [];
        let enemyCount = 5;
        
        // Keyboard controls
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // Touch controls for mobile
        let touchX = 0;
        let touchY = 0;
        
        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            touchX = touch.clientX;
            touchY = touch.clientY;
        });
        
        document.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            touchX = touch.clientX;
            touchY = touch.clientY;
        });
        
        // Mouse/touch shooting
        document.addEventListener('click', shootWeb);
        document.addEventListener('touchend', shootWeb);
        
        function shootWeb() {
            if (!gameRunning) return;
            
            const angle = Math.atan2(touchY - player.y, touchX - player.x);
            
            const bullet = {
                x: player.x + player.width / 2,
                y: player.y + player.height / 2,
                radius: 6,
                speed: 8,
                dx: Math.cos(angle),
                dy: Math.sin(angle)
            };
            
            bullets.push(bullet);
        }
        
        // Draw Spider-Man
        function drawSpiderMan(x, y, width, height) {
            // Body (red)
            ctx.fillStyle = '#CC0000';
            ctx.fillRect(x + 10, y + 15, width - 20, height - 25);
            
            // Head (red)
            ctx.fillStyle = '#CC0000';
            ctx.beginPath();
            ctx.arc(x + width / 2, y + 10, 8, 0, Math.PI * 2);
            ctx.fill();
            
            // Eyes (white)
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(x + width / 2 - 4, y + 8, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + width / 2 + 4, y + 8, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Eye pupils (black)
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(x + width / 2 - 4, y + 8, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + width / 2 + 4, y + 8, 1.5, 0, Math.PI * 2);
            ctx.fill();
            
            // Web pattern on chest
            ctx.strokeStyle = '#0066FF';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x + width / 2, y + 15);
            ctx.lineTo(x + width / 2, y + height - 10);
            ctx.stroke();
            
            // Arms (red)
            ctx.fillStyle = '#CC0000';
            ctx.fillRect(x, y + 20, 8, 20);
            ctx.fillRect(x + width - 8, y + 20, 8, 20);
        }
        
        // Create enemies (villains)
        function createEnemies() {
            enemies = [];
            for (let i = 0; i < enemyCount; i++) {
                const enemy = {
                    x: Math.random() * (canvas.width - 40),
                    y: Math.random() * (canvas.height - 40),
                    width: 40,
                    height: 40,
                    speed: 2,
                    health: 1
                };
                enemies.push(enemy);
            }
        }
        
        createEnemies();
        
        // Game loop
        function update() {
            if (!gameRunning) return;
            
            // Move player with arrow keys or WASD
            if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
            
            // Keep player in bounds
            player.x = Math.max(0, Math.min(player.x, canvas.width - player.width));
            player.y = Math.max(0, Math.min(player.y, canvas.height - player.height));
            
            // Update bullets (web shots)
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].dx * bullets[i].speed;
                bullets[i].y += bullets[i].dy * bullets[i].speed;
                
                // Remove bullets out of bounds
                if (bullets[i].x < 0 || bullets[i].x > canvas.width || 
                    bullets[i].y < 0 || bullets[i].y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }
            
            // Update enemies
            for (let i = 0; i < enemies.length; i++) {
                const enemy = enemies[i];
                
                // Move towards player
                const dx = player.x - enemy.x;
                const dy = player.y - enemy.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > 0) {
                    enemy.x += (dx / distance) * enemy.speed;
                    enemy.y += (dy / distance) * enemy.speed;
                }
                
                // Check collision with player
                if (dx * dx + dy * dy < (player.width + enemy.width) * (player.width + enemy.width) / 4) {
                    player.health -= 1;
                    if (player.health <= 0) {
                        endGame();
                    }
                }
            }
            
            // Check bullet-enemy collisions
            for (let i = bullets.length - 1; i >= 0; i--) {
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const bullet = bullets[i];
                    const enemy = enemies[j];
                    
                    const dx = bullet.x - (enemy.x + enemy.width / 2);
                    const dy = bullet.y - (enemy.y + enemy.height / 2);
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < bullet.radius + enemy.width / 2) {
                        bullets.splice(i, 1);
                        enemies.splice(j, 1);
                        score += 10;
                        break;
                    }
                }
            }
            
            // Spawn new enemies if all are gone
            if (enemies.length === 0) {
                enemyCount++;
                createEnemies();
            }
            
            // Update UI
            document.getElementById('score').textContent = 'Score: ' + score;
            document.getElementById('health').textContent = 'Health: ' + player.health;
        }
        
        function draw() {
            // Clear canvas with gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw player (Spider-Man)
            drawSpiderMan(player.x, player.y, player.width, player.height);
            
            // Draw bullets (web shots)
            ctx.fillStyle = '#0066FF';
            for (let bullet of bullets) {
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Add glow
                ctx.strokeStyle = 'rgba(0, 102, 255, 0.5)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, bullet.radius + 3, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            // Draw enemies (red squares for now)
            ctx.fillStyle = '#FF6600';
            for (let enemy of enemies) {
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                
                // Enemy outline
                ctx.strokeStyle = '#FF0000';
                ctx.lineWidth = 2;
                ctx.strokeRect(enemy.x, enemy.y, enemy.width, enemy.height);
            }
        }
        
        function endGame() {
            gameRunning = false;
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('finalScore').textContent = 'Final Score: ' + score;
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        gameLoop();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
